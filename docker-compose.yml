services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lmsvr-sm-frontend:dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      PNPM_HOME: /pnpm
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    user: app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true
    command: sh -lc "pnpm dev -- --host 0.0.0.0 --port 5173"

  audit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lmsvr-sm-frontend:dev
    profiles:
      - audit
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm
    environment:
      NODE_ENV: development
      PNPM_HOME: /pnpm
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    user: app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: sh -lc "pnpm audit"

volumes:
  frontend_node_modules:
  pnpm_store: